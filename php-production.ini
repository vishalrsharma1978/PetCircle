; PawCircle production PHP hardening — dropped into $PHP_INI_DIR/conf.d/ by
; the Dockerfile. Settings here close server-level gaps that can't be set
; from PHP at runtime (expose_php and allow_url_include are PHP_INI_SYSTEM
; and ignored by ini_set()). Adapted from community_proj (eSamaj)'s own
; php-production.ini, with the upload limits sized to this app's real caps.

; --- Information disclosure ---
; Never render PHP warnings/stack traces to the client; log them instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; --- Insecure server directive defaults ---
; Stop advertising the PHP version in the X-Powered-By response header.
expose_php = Off
; The app talks to Supabase (and SendPulse) exclusively over cURL, never via
; URL-aware file functions, so remote fopen/include can be disabled to kill
; RFI/SSRF vectors.
allow_url_fopen = Off
allow_url_include = Off

; --- Session hardening (defense in depth) ---
; The app issues its own signed session cookie (api/routes/session.php), but
; harden PHP's native session handler too in case it's ever used.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_only_cookies = 1

; --- Upload limits ---
; api/routes/core.php's handlePhotoUpload() enforces a 25MB cap for
; post/gallery media (images+video) and 2MB for avatars/covers/verification/
; reactions/ads — post_max_size needs headroom above the largest of those for
; multipart overhead.
upload_max_filesize = 30M
post_max_size = 35M
max_file_uploads = 10

; --- Misc resource limits ---
max_execution_time = 60
memory_limit = 256M
