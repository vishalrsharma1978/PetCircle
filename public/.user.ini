; Hostinger (and most shared hosts) run PHP via PHP-FPM, where php_value
; directives in .htaccess are ignored — .user.ini is the mechanism that
; actually works there, picked up automatically from this directory (the
; document root) with no hPanel configuration needed. Changes take effect
; within a few minutes (PHP-FPM caches .user.ini for user_ini.cache_ttl,
; 300s by default) — no server restart required or possible on shared hosting.
;
; Only PHP_INI_PERDIR/PHP_INI_ALL scoped directives can be set this way.
; A few production-hardening settings from this project's Docker path
; (php-production.ini) are PHP_INI_SYSTEM-only and CANNOT be set here —
; expose_php, allow_url_fopen, allow_url_include. On Hostinger those are
; controlled (if at all) via hPanel's own PHP Configuration screen, not a
; file you upload; leave them at Hostinger's defaults unless that screen
; offers them.

; --- Information disclosure ---
display_errors = Off
display_startup_errors = Off
log_errors = On

; --- Session hardening (defense in depth; the app issues its own signed
; session cookie and doesn't rely on PHP's native session handler) ---
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; --- Upload limits — api/routes/core.php's handlePhotoUpload() enforces a
; 25MB cap for post/gallery media (images+video) and 2MB for avatars/covers/
; verification/reactions/ads; post_max_size needs headroom above the larger
; cap for multipart overhead ---
upload_max_filesize = 30M
post_max_size = 35M
max_file_uploads = 10

; --- Misc resource limits ---
max_execution_time = 60
memory_limit = 256M
